<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="NawecTrack GM — Live electricity & water outage tracker, Cashpower unit calculator, and NAWEC station directory for The Gambia." />
  <title>NawecTrack GM | Live Power & Water Tracker</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https:// + cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-badge">GM</span>
        <div>
          <h1>NawecTrack GM</h1>
          <p class="subtitle">Live Community Power &amp; Water Status</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="liveIndicator" class="live-pill" title="Connected to Realtime">● Live</span>
        <button id="toggleAdminBtn" class="btn-outline btn-sm" type="button">🛡️ Admin</button>
        <button id="installBtn" class="btn-install hidden" type="button">⬇ Install App</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="officialAlertsSection" class="alerts-container hidden" aria-live="polite"></section>

    <section id="adminPanel" class="card admin-card hidden">
      <div class="card-header">
        <h2>🛡️ Official NAWEC / Admin Portal</h2>
        <span class="badge-sec" id="adminRoleBadge">RBAC Protected</span>
      </div>

      <form id="adminLoginForm" class="stack">
        <p class="muted">Sign in with your verified admin credentials to broadcast notices, moderate blackouts, or manage admins.</p>
        <div class="grid-2">
          <input type="email" id="adminEmail" placeholder="Admin email" required autocomplete="username" />
          <input type="password" id="adminPassword" placeholder="Password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary">Sign In to Admin Portal</button>
        <p id="adminLoginMsg" class="feedback-msg"></p>
      </form>

      <div id="adminControls" class="hidden stack">
        <div class="admin-bar">
          <span id="adminUserLabel" class="muted"></span>
          <button type="button" id="adminLogoutBtn" class="btn-outline btn-sm">Sign Out</button>
        </div>

        <form id="alertBroadcastForm" class="stack">
          <h3>📢 Broadcast Official NAWEC Notice</h3>
          <div class="grid-2">
            <div>
              <label for="adminCity">Target City</label>
              <select id="adminCity" required></select>
            </div>
            <div>
              <label for="adminWard">Ward (Optional — blank = whole city)</label>
              <select id="adminWard">
                <option value="">All Wards (City-Wide)</option>
              </select>
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label for="adminUtility">Utility</label>
              <select id="adminUtility" required>
                <option value="electricity">Electricity</option>
                <option value="water">Water</option>
                <option value="both">Both Electricity &amp; Water</option>
              </select>
            </div>
            <div>
              <label for="adminStatus">Official Status</label>
              <select id="adminStatus" required>
                <option value="OFF">🔴 OFF (Feeder Outage)</option>
                <option value="PARTIAL">🟡 PARTIAL (Load Shedding)</option>
                <option value="MAINTENANCE">🟠 MAINTENANCE</option>
                <option value="ON">🟢 ON (Restored)</option>
              </select>
            </div>
          </div>
          <div>
            <label for="adminMessage">Official Notice (max 300 chars)</label>
            <input type="text" id="adminMessage" maxlength="300" placeholder="e.g., Brikama Feeder 2 under scheduled maintenance until 18:00." required />
          </div>
          <button type="submit" class="btn-primary">Broadcast Official Alert</button>
          <p id="adminBroadcastMsg" class="feedback-msg"></p>
        </form>

        <div id="activeAdminAlertsList" class="stack"></div>

        <hr />
        <h3>🚨 Blackout Escalations (Flag or Delete)</h3>
        <p class="muted">All "Light is OFF" and "Water is OFF" reports route here automatically. Flagging hides a report from the public feed; deleting removes it permanently.</p>
        <ul id="adminBlackoutList" class="feed-list">
          <li class="muted">No blackout escalations yet.</li>
        </ul>

        <div id="mainAdminUserSection" class="hidden stack">
          <hr />
          <h3>👑 Main Admin: Manage Admin Users</h3>
          <p class="muted">Only the Main Admin can assign new admins or block/unblock standard admins.</p>
          <form id="addAdminForm" class="stack">
            <div class="grid-2">
              <input type="email" id="newAdminEmail" placeholder="New admin email" required />
              <input type="text" id="newAdminName" placeholder="Full name & title" required />
            </div>
            <button type="submit" class="btn-primary">+ Add Standard Admin</button>
            <p id="addAdminMsg" class="feedback-msg"></p>
          </form>
          <ul id="adminUsersList" class="feed-list"></ul>
        </div>
      </div>
    </section>

        <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="trackerTab" type="button">⚡ Live Status</button>
      <button class="tab" data-tab="cashpowerTab" type="button">🧮 Cashpower Calc</button>
      <button class="tab" data-tab="stationsTab" type="button">🏭 Power Stations</button>
    </nav>

    <!-- Area tracker, reporting tools, and cashpower calculator components -->
    <section id="trackerTab" class="tab-panel active">
      <!-- Live status panels and community reporting forms -->
    </section>

    <section id="cashpowerTab" class="tab-panel hidden">
      <!-- NAWEC Cashpower unit calculator -->
    </section>

    <section id="stationsTab" class="tab-panel hidden">
      <!-- Power stations and substations overview -->
    </section>
  </main>

  <footer class="app-footer">
    <p>NawecTrack GM • Community Utility Monitor for The Gambia</p>
    <p class="muted">Security: PostgreSQL RLS • 15m Rate-Limit Trigger • Salted Device Hash • XSS Sanitization</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
